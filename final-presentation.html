<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101e32"><title>Meridian | Product Leadership Final Project</title><style>
:root{--navy:#101e32;--blue:#276caa;--ink:#17283b;--muted:#5d6f80;--silver:#d9e3e9;--white:#fff;--light:#f4f7fa}*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,Helvetica,sans-serif;background:#09121f;color:var(--ink)}.stage{min-height:100vh;display:grid;place-items:center;padding:42px 64px 88px}.slide{position:relative;width:min(1240px,100%);min-height:min(690px,calc(100vh - 130px));aspect-ratio:16/9;background:var(--white);border-radius:12px;overflow:hidden;box-shadow:0 25px 75px #0008;padding:7% 8%;display:flex;flex-direction:column;justify-content:center}.slide:before{content:"";position:absolute;top:0;left:0;width:100%;height:8px;background:linear-gradient(90deg,#193e67,#428bc0,#b5c9d6)}.eyebrow{font-size:clamp(11px,1.1vw,15px);letter-spacing:.2em;color:var(--blue);font-weight:800;margin-bottom:18px;text-transform:uppercase}h1{font-size:clamp(35px,5.2vw,70px);line-height:1.08;letter-spacing:-.04em;margin:0 0 24px;max-width:1000px}h2{font-size:clamp(32px,4.2vw,56px);line-height:1.12;letter-spacing:-.035em;margin:0 0 28px}p{font-size:clamp(17px,1.75vw,23px);line-height:1.55;margin:0 0 16px;color:#41556b}.lead{font-size:clamp(21px,2.5vw,34px);font-weight:600;line-height:1.35;color:#244e74;max-width:1000px}.support{margin-top:22px;color:var(--muted);font-size:clamp(14px,1.4vw,18px)}.cols{display:grid;grid-template-columns:1fr 1fr;gap:25px;margin-top:10px}.panel{background:var(--light);padding:28px;border-radius:10px;border-top:4px solid #417eae}.panel h3{margin:0 0 12px;font-size:clamp(14px,1.4vw,19px);color:#1b5789;text-transform:uppercase;letter-spacing:.08em}.panel p{font-size:clamp(16px,1.55vw,21px);color:var(--ink)}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.cards .panel{padding:24px}.cards .panel p{font-size:clamp(15px,1.35vw,19px)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:20px}.stat{padding:24px 20px;background:var(--light);border-radius:10px;border-bottom:5px solid #4d8db9}.stat b{font-size:clamp(32px,4.4vw,57px);letter-spacing:-.045em;color:#1f659b;display:block;margin-bottom:15px}.stat span{font-size:clamp(15px,1.4vw,20px);line-height:1.4}.quote{font-size:clamp(26px,3.4vw,45px);line-height:1.32;font-weight:700;letter-spacing:-.02em;color:#19496e;border-left:7px solid #4d93be;padding-left:28px}.lane{display:grid;grid-template-columns:110px 1fr;align-items:center;gap:20px;padding:15px 0;border-bottom:1px solid #d7e1e9}.lane b{color:#2b75a5;font-size:19px}.lane span{font-size:clamp(15px,1.5vw,20px);line-height:1.5}.slide.dark{background:radial-gradient(circle at 100% 0%,#255782,#101e32 62%);color:white}.dark:before{background:#89b6d6}.dark .eyebrow{color:#a9cde4}.dark p,.dark .lead,.dark .support{color:#dce9f2}.dark .quote{color:white}.byline{margin-top:36px;letter-spacing:.07em;font-size:18px;color:#b2cfdf}.footer{position:absolute;left:8%;bottom:30px;color:#8a9dab;font-size:12px;letter-spacing:.09em}.dark .footer{color:#a7bbcc}.controls{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);display:flex;align-items:center;gap:14px;background:#15263a;border:1px solid #425268;padding:9px 15px;border-radius:999px;color:#e5eef6;z-index:20;box-shadow:0 6px 22px #0006}.controls button{background:#2a567c;color:white;border:0;border-radius:50%;width:34px;height:34px;cursor:pointer;font-size:21px}.controls button:hover{background:#3979aa}.controls span{font-size:13px;font-variant-numeric:tabular-nums;min-width:52px;text-align:center}.progress{position:fixed;left:0;bottom:0;height:4px;background:#6da4cd;transition:width .2s;z-index:50}.hint{position:fixed;right:22px;bottom:27px;color:#a9bbc9;font-size:12px}a{color:inherit}@media(max-width:760px){.stage{padding:12px 12px 85px}.slide{min-height:calc(100svh - 105px);aspect-ratio:auto;padding:52px 7% 58px}.cols,.cards,.stats{grid-template-columns:1fr;gap:10px}.panel,.cards .panel,.stat{padding:12px 16px}.panel p,.cards .panel p,.stat span{font-size:15px}.stat b{font-size:30px;margin-bottom:2px}.stat{border-bottom-width:3px}.stats{gap:8px}.eyebrow{margin-bottom:12px}h2{font-size:32px;margin-bottom:19px}h1{font-size:41px}.lane{grid-template-columns:65px 1fr;gap:9px;padding:9px 0}.lane span{font-size:14px}.lane b{font-size:14px}.footer{bottom:15px}.hint{display:none}}@media print{body{background:white}.stage{padding:0;display:block;min-height:auto}.slide{page-break-after:always;border-radius:0;box-shadow:none;min-height:100vh;width:100%;aspect-ratio:auto}.controls,.progress,.hint{display:none}@page{size:landscape;margin:0}}
</style></head><body><main class="stage"><article class="slide" id="slide" aria-live="polite"></article></main><nav class="controls" aria-label="Slide controls"><button id="prev" aria-label="Previous slide">‹</button><span id="count"></span><button id="next" aria-label="Next slide">›</button><button id="print" aria-label="Print presentation" title="Print / Save as PDF" style="width:auto;border-radius:16px;padding:0 13px;font-size:12px">PDF</button></nav><div class="progress" id="progress"></div><div class="hint">← → Navigate · F Fullscreen · P Print</div><script>
const slides=[["cover","FINAL PROJECT • PRODUCT LEADERSHIP CERTIFICATION","Meridian: Closing the Field Gap","Win field adoption without compromising enterprise depth.","Josh Agusti · Product School · PLC 2026.1","The central bet: make jobsite capture as easy as a group text, with a faster path to resolution and a reliable enterprise record."],["section","THE CASE","A great system that field teams avoid","Meridian serves enterprise construction operations. Yet foremen and superintendents still use camera rolls and group texts to report issues.","The leadership challenge is not adding more features. It is changing daily behavior while protecting the capabilities enterprise customers pay for."],["metrics","THE STARTING POINT","The adoption gap","18%","Weekly active licensed field seats","34%","Field issues resolved within same-shift SLA","65%","Incidents first reported outside Meridian"],["two","MODULE 1 · PLAYING TO WIN","Make the field the starting point","WHERE TO PLAY","Foremen and superintendents at mid-market and enterprise general contractors already using Meridian, beginning with field documentation, RFIs and issue capture on U.S. commercial jobsites.","HOW TO WIN","An offline-capable, camera-first capture layer that turns familiar photo-reporting behavior into structured project records and gives crews visible status and responses."],["cards","MODULE 1 · STRATEGIC SYSTEM","Strategy beyond a feature list","Winning aspiration|The fastest, most trusted way to capture and escalate a site issue.","Critical capabilities|Sub-3-second photo-to-post ambition, offline-first use, auto-tagging and routing, meaningful response loops.","Management system|Weekly active field use and logging friction; monthly account reviews; quarterly usage-to-license reviews."],["quote","MODULE 1 · THE HARD NO","Protect what pays for the product","We will not redesign the enterprise project console or its permissioning model to simplify field use.","Instead, build a focused capture layer, with scoped field actions when justified. Preserve enterprise compliance, control and reporting."],["metrics","MODULE 1 · OUTCOME OKRS","Three measures of a behavior change","18% → 60%","Weekly active field seats by Q3","34% → 70%","Same-shift issue resolution by Q3","65% → \u003c20%","Incidents reported first via informal channels by Q3"],["two","MODULE 1 · PRESSURE TEST","Friction is not the only barrier","THE CHALLENGE","A timestamped, attributable record can create perceived liability. Making the workflow faster may not persuade workers who do not trust how the record will be used.","LEADERSHIP RESPONSE","Validate friction versus trust before committing heavily; measure business outcomes such as fewer disputes or less rework. Retain the enterprise-console hard no."],["cards","MODULE 2 · BACKLOG AUDIT","Three Rocks that reinforce one another","01 · Simpler daily logs|Reduce required fields from 14 to four. Attack completion friction and improve habitual logging.","02 · Offline-first capture|Work in low-connectivity jobsites so logging is possible when it matters.","03 · Photo annotation|Make Meridian a credible alternative to sharing annotated photos via text."],["cards","MODULE 2 · EXPLICIT TRADE-OFFS","The three Hard Nos","No custom executive KPI dashboard|Two renewals are at risk, but this does not directly unlock field adoption. Support the accounts outside the current build queue.","No automated compliance generator|Three enterprise requests do not outweigh the cost of deeper console complexity.","No cosmetic web UI refresh|Sales feedback matters, but aesthetic refresh does not resolve the field behavior gap."],["roadmap","MODULE 2 · OUTCOME ROADMAP","Now / Next / Later","NOW|Validate what blocks adoption; pilot a four-field daily log; test offline reliability and field activation.|NEXT|Expand photo annotation, routing, status feedback and issue resolution flow after measured field use improves.|LATER|Scale successful workflows and revisit adjacent requests with evidence and explicit trade-offs.","Presentation synthesis of repository Rocks and strategic intent. The final Now/Next/Later table remains a TODO in the source repo."],["two","MODULE 3 · LEAD HIGH-PERFORMING TEAMS","Fix the decision system, not the person","THE SITUATION","A product manager reopened the executive-dashboard request in three sprint-planning meetings because of two renewal risks, consuming time reserved for field work.","THE DIAGNOSIS","Clarity gap: priorities were decided, but no process explained how new commercial evidence could reopen them. The leadership response is a private, evidence-led conversation and a decision pathway."],["cards","MODULE 3 · TEAM CHARTER","Clear ownership makes focus sustainable","WHAT WE OWN|Capture → routing → resolution visibility for field workers. Enterprise-console redesign and executive dashboards remain out of scope.","HOW WE DECIDE|PM owns scope within strategy; engineering owns implementation; design owns interaction; product lead owns quarterly exceptions.","HOW WE WORK|Escalate urgent renewal risk within two business days; record decisions; raise blockers within one business day; seek field feedback every sprint."],["two","MODULE 4 · EXECUTIVE INFLUENCE","A firm no with a practical yes","THE POSITION","Do not build the custom executive KPI dashboard this quarter. Preserve the three field-adoption Rocks.","THE RELATIONSHIP","Acknowledge sales leadership's renewal exposure and credibility. Within two business days, review actual buyer needs and alternatives; within one week, validate an interim reporting brief. Escalate only with new evidence and an explicit displaced Rock."],["cards","MODULE 4 · NEGOTIATION DESIGN","Three paths that avoid false promises","OPTION A|Use existing reporting and customer-success briefs to meet executive information needs.","OPTION B|Do focused buyer discovery and timebox reconsideration for a reusable solution, without promising a build.","OPTION C|Request a formal exception only when evidence proves necessity; engineering sizes it and leadership accepts the trade-off."],["section","MODULE 5 · INVESTMENT THESIS","Fund learning before scale","Selected Rock #1: simplify daily logs from 14 required fields to four.","This is a hypothetical coursework financial model. It is a retention thesis, not a claim of measured revenue, approved spending or completed experiments."],["metrics","MODULE 5 · BUSINESS CASE","A staged $40K investment","$10K","Pilot allocation (inside build budget)","$30K","Conditional rollout allocation","$44K","Modeled first full benefit-year net after build + operations"],["two","MODULE 5 · FINANCIAL MECHANICS","Five more renewals drive the return","ASSUMPTIONS","100 eligible accounts; $24,000 annual contract; 80% gross margin; retention rises 85% → 90%; $12,000 incremental annual operating cost.","MODEL","5 additional retained accounts × $19,200 contribution = $96,000 gross contribution. Less $12,000 operations and $40,000 build = $44,000 modeled first full benefit-year net. Break-even: 3 incremental renewals."],["two","MODULE 5 · KILL CRITERIA","Make the stop decision before the build","EIGHT-WEEK ADOPTION GATE","A 20-account pilot, evenly split. If improvement in weekly active users is \u003c15 percentage points above the comparison group's change, stop expansion and cancel unspent $30K rollout.","12-MONTH VALUE GATE","If fewer than three incremental renewals can be supported against a comparable baseline, stop further investment and reallocate avoidable annual cost."],["two","ADDITIONAL FUNDING EXERCISE","AI Bid Estimation: correct the denominator","THE CLAIM","A Standard-tier AI estimation feature is projected to lift Enterprise upsell from 6% to 8% across 400 accounts. The case credits 32 upgrades and claims $896K incremental ARR on a $180K build.","THE CORRECTION","24 upgrades already occur at the 6% baseline. Just 8 are incremental, or at most $224K annualized using the case's $28K assumption. Even that is not proven net expansion ARR."],["metrics","FUNDING EVALUATION · SENSITIVITY","The forecast is fragile","6%","Baseline upsell: 24 accounts","8%","Target upsell: 32 accounts","7%","Q3 pause threshold: 28 accounts"],["quote","FUNDING EVALUATION · DECISION","Fund with one condition","Release the $180,000 AI estimation build budget only after a limited validation shows a credible, feature-attributable path to incremental Enterprise upgrades and a corrected net-expansion business case.","No completed pilot or approved funding is represented here. The AI case supplements, but does not replace, the Field Gap roadmap."],["cards","MODULE 6 · INDIVIDUAL INSIGHTS","What challenged my assumptions","FRICTION|Turning a long backlog into a coherent strategy while facing legitimate, urgent revenue requests.","KEY LEARNING|A Hard No is credible only when accompanied by evidence, decision rights, an escalation path and a workable alternative.","AHA MOMENT|A speed improvement cannot create adoption if trust is the hidden constraint. Validate the human behavior before scaling the build."],["two","MODULE 6 · REFLECTION","What I will carry forward","KEEP DOING","Translate strategy into a few measurable bets; separate outcomes from features; predefine gates and failure criteria; document trade-offs; treat stakeholder pushback as information.","FURTHER WORK","Complete the repository's final roadmap artifact, run the Module 3 role-play and Module 4 partner practice, reconcile the Module 1 KR2 reflection, and conduct a business-case AI stress test."],["section","CLOSING","Strategy is a sequence of accountable choices","Win field trust. Protect enterprise value. Prioritize what moves behavior. Fund evidence. Lead through clear decisions.","Product leadership is the discipline of linking an ambition to execution, economics, people and defensible trade-offs."],["end","THANK YOU","Meridian · The Field Gap","Product School · Product Leadership Final Project","Repository: github.com/joshagusti-cmd/Product-Leadership","All plans, targets and financial projections are coursework artifacts unless otherwise marked."]];let i=0;const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));function render(){const a=slides[i],type=a[0],el=document.getElementById("slide");let html='<div class="eyebrow">'+esc(a[1])+'</div>'+(type==="cover"?'<h1>'+esc(a[2])+'</h1><div class="lead">'+esc(a[3])+'</div><div class="byline">'+esc(a[4])+'</div><p class="support">'+esc(a[5])+'</p>':type==="end"?'<h1>'+esc(a[2])+'</h1><p class="lead">'+esc(a[3])+'</p><p>'+esc(a[4])+'</p><p class="support">'+esc(a[5])+'</p>':type==="section"?'<h1>'+esc(a[2])+'</h1><p class="lead">'+esc(a[3])+'</p><p class="support">'+esc(a[4])+'</p>':type==="quote"?'<h2>'+esc(a[2])+'</h2><div class="quote">'+esc(a[3])+'</div><p class="support">'+esc(a[4])+'</p>':type==="metrics"?'<h2>'+esc(a[2])+'</h2><div class="stats">'+[3,5,7].map(k=>'<div class="stat"><b>'+esc(a[k])+'</b><span>'+esc(a[k+1])+'</span></div>').join('')+'</div>':type==="two"?'<h2>'+esc(a[2])+'</h2><div class="cols">'+[3,5].map(k=>'<div class="panel"><h3>'+esc(a[k])+'</h3><p>'+esc(a[k+1])+'</p></div>').join('')+'</div>':type==="cards"?'<h2>'+esc(a[2])+'</h2><div class="cards">'+a.slice(3).map(v=>{let [x,...y]=v.split("|");return '<div class="panel"><h3>'+esc(x)+'</h3><p>'+esc(y.join("|"))+'</p></div>'}).join('')+'</div>':type==="roadmap"?'<h2>'+esc(a[2])+'</h2>'+a.slice(3,6).map(v=>{let [x,...y]=v.split("|");return '<div class="lane"><b>'+esc(x)+'</b><span>'+esc(y.join(" "))+'</span></div>'}).join('')+'<p class="support">'+esc(a[6])+'</p>':"");el.className="slide"+(["cover","section","end"].includes(type)?" dark":"");el.innerHTML=html+'<div class="footer">MERIDIAN / PRODUCT LEADERSHIP · OCT 2026</div>';document.getElementById("count").textContent=(i+1)+" / "+slides.length;document.getElementById("progress").style.width=((i+1)/slides.length*100)+"%";location.hash="slide-"+(i+1)}function go(d){i=Math.max(0,Math.min(slides.length-1,i+d));render()}document.getElementById("prev").onclick=()=>go(-1);document.getElementById("next").onclick=()=>go(1);document.getElementById("print").onclick=()=>window.print();document.addEventListener("keydown",e=>{if(["ArrowRight","PageDown"," "].includes(e.key)){e.preventDefault();go(1)}if(["ArrowLeft","PageUp"].includes(e.key)){e.preventDefault();go(-1)}if(e.key.toLowerCase()==="f"){document.documentElement.requestFullscreen?.()}if(e.key.toLowerCase()==="p"){window.print()}});let sx=null;document.addEventListener("touchstart",e=>sx=e.touches[0].clientX,{passive:true});document.addEventListener("touchend",e=>{if(sx!==null){let d=e.changedTouches[0].clientX-sx;if(Math.abs(d)>65)go(d<0?1:-1);sx=null}},{passive:true});let initial=Number((location.hash.match(/slide-(\d+)/)||[])[1]);if(initial>0&&initial<=slides.length)i=initial-1;render();
</script></body></html>
